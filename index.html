<html>
	<head>
		<script type="text/javascript" src="shared.js"></script>
		<script type="text/javascript" src="tia.js"></script>
		<script type="text/javascript" src="rom.js"></script>
		<script type="text/javascript" src="process.js"></script>
		<script type="text/javascript" src="test.js"></script>
		<script type="text/javascript">
                   const roms = {
                     "kernel01": kernel01,
                     "kernel13": kernel13,
                     "kernel15": kernel15,
                     "kernel22": kernel22,
                     "diag": diag,
		     "demo3_8": demo3_8,
		     "complexscene1": complexscene1,
		     "sethorizpos": sethorizpos,
		     "piatimer": piatimer,
		     "timing2": timing2,
                     "hello": hello,
                     "logo": logo,
		     "combat": combat,
                     "frogger": frogger,
		     "pongsports": pongsports,
                   };

		   let romName = "complexscene1";
		   // let romName = "frogger";

		   const changeRom = (rn) => {
		     romName = rn
	             document.dispatchEvent(new Event("chrom"));
		   }

		   const loadDebugInfo = () => {
		     document.getElementById("rx").innerHTML = pstatus.rx.toString(16);
		     document.getElementById("ry").innerHTML = pstatus.ry.toString(16);
		     document.getElementById("ra").innerHTML = pstatus.ra.toString(16);
		     document.getElementById("sp").innerHTML = pstatus.sp.toString(16);
		     document.getElementById("pc").innerHTML = formatPc(pstatus.pc)

		     document.getElementById("fx").innerHTML = ["c:", pstatus.fc, "z:", pstatus.fz, "i:", pstatus.fi, "d:", pstatus.fd, "b:", _fb, "_:", 1, "v:", pstatus.fv, "n:", pstatus.fn].join(" ");

		     document.getElementById("intim").innerHTML = pstatus.intim;
		     document.getElementById("instat").innerHTML = pstatus.instat.toString(2);
		   }

		   const loadSource = (rbx) => {
                     const lines = decode(rbx);

		     const asm = [];
		     for (const line of lines) {
			const [address, src] = line;
			const srcHtml = src.replaceAll(" ", "&nbsp;");

			if (breakpoints.has(parseInt(address, 16))) {
		          asm.push(`<div id="line-${address}"><span style="background: #ff0000; color: #fff;">${address}</span> ${srcHtml}</div>`);
			} else {
		          asm.push(`<div id="line-${address}">${address} ${srcHtml}</div>`);
			}
		     }

                     document.getElementById("source").innerHTML = asm.join("\n");
		   }

		   const readRom = () => {
		     const rom = roms[romName];

                     return loadFromBase64(rom);
		   }

		   const startRom = () => {
		     console.log("startRom", romName);
		     const romBytes = readRom();

		     breakpoints.clear();
                     loadSource(romBytes);

		     rx = 0;
		     ry = 0;
		     ra = 0;
		     sp = 0;

		     fc = 0;
                     fc = 0;
                     fn = 0;
                     fi = 0;
                     fd = 0;
                     _fb = 0;
                     fv = 0;
                     fz = 0;

		     pc = 0;

		     // logSteps = 4_500;
		     process(romBytes);
		   }
                   
		   const toggleBreakpoint = (address) => {
		     const romBytes = readRom();

		     if (breakpoints.has(address)) {
		       breakpoints.delete(address);
		     } else {
		       breakpoints.add(address);
		     }

		     loadSource(romBytes);
		   }

		   document.addEventListener("DOMContentLoaded", (event) => {
		     document.getElementById("source").addEventListener("dblclick", (event) => {
                       console.log(event, window.getSelection().focusOffset);
	               toggleBreakpoint(parseInt(event.target.innerHTML.slice(0, 4), 16));
		     });

		     document.getElementById("continue").addEventListener("click", (event) => {
                       document.dispatchEvent(new Event("continue"));
		     });

                     startRom();

		     document.addEventListener("draw", () => { frc++; });
		     document.addEventListener("chrom", () => { startRom(); });
		     document.addEventListener("break", () => { console.log("BR"); loadDebugInfo(); });
                   });

		   var frc = 0; 
		   
		   const updateFr = () => {
		     document.getElementById("fr").value = frc;

		     frc = 0;
		   }

		   setInterval(() => updateFr(), 1_000);
		</script>
	</head>
	<body>
          <div style="display: flex">
	    <div>
	      <canvas id="tehScreen" width="160" height="192"></canvas>
	      <div><input type="text" id="fr"></div>
	      <div style="display: flex">
	        <select onChange="changeRom(this.options[this.selectedIndex].value)" autofocus>
	          <option value="kernel01">Kernel 01</option>
	          <option value="kernel13">Kernel 13</option>
	          <option value="kernel15">Kernel 15</option>
	          <option value="kernel22">Kernel 22</option>
	          <option value="demo3_8">Demo3_8</option>
	          <option value="complexscene1" selected>complexscene1</option>
	          <option value="sethorizpos">sethorizpos</option>
	          <option value="piatimer">piatimer</option>
	          <option value="timing2">timing2</option>
 	          <option value="hello">Hello</option>
	          <option value="diag">Diag</option>
	          <option value="logo">Logo</option>
	          <option value="combat">Combat</option>
	          <option value="frogger">Frogger</option>
	          <option value="pongsports">Pong Sports</option>
	        </select>
	      </div>
	    </div>
	    <div>
	      <div style="display: flex; flex-direction: column; font-family: courier;">
		<button id="continue">Continue</button>
		<div id="debuginfo">
		  <div>RX: <span id="rx">0</span></div>
		  <div>RY: <span id="ry">0</span></div>
		  <div>RA: <span id="ra">0</span></div>
		  <div>SP: <span id="sp">0</span></div>
		  <div>PC: <span id="pc">0</span></div>
		  <div>Flags: <span id="fx">0</span></div>
		  <div>INTIM: <span id="intim">0</span></div>
		  <div>INSTAT: <span id="instat">0</span></div>
		  <div>INTERVAL: <span id="interval">0</span></div>
		</div>
		<div id="source" rows="40" cols="50"></div>
	      </div>
	    </div>
          </div>
	</body>
</html>
