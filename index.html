<html>
	<head>
		<script type="text/javascript" src="shared.js"></script>
		<script type="text/javascript" src="tia.js"></script>
		<script type="text/javascript" src="rom.js"></script>
		<script type="text/javascript" src="process.js"></script>
		<script type="text/javascript" src="test.js"></script>
		<script type="text/javascript">
                   const roms = {
                     "kernel01": kernel01,
                     "kernel13": kernel13,
                     "kernel15": kernel15,
                     "kernel22": kernel22,
                     "diag": diag,
		     "demo3_8": demo3_8,
		     "bitmap": bitmap,
		     "complexscene1": complexscene1,
		     "sethorizpos": sethorizpos,
		     "piatimer": piatimer,
		     "timing2": timing2,
                     "hello": hello,
                     "logo": logo,
		     "combat": combat,
                     "frogger": frogger,
		     "pongsports": pongsports,
                   };

		   let romName = "bitmap";
		   // let romName = "frogger";

		   const changeRom = (rn) => {
		     romName = rn
	             document.dispatchEvent(new Event("chrom"));
		   }

		   const loadDebugInfo = () => {
	             document.getElementById("rx").innerHTML = `$${pstatus.rx.toString(16).padStart(2, "0")} (${pstatus.rx.toString(2).padStart(8, "0")})`;
		     document.getElementById("ry").innerHTML = `$${pstatus.ry.toString(16).padStart(2, "0")} (${pstatus.ry.toString(2).padStart(8, "0")})`;
		     document.getElementById("ra").innerHTML = `$${pstatus.ra.toString(16).padStart(2, "0")} (${pstatus.ra.toString(2).padStart(8, "0")})`;
		     document.getElementById("sp").innerHTML = pstatus.sp.toString(16);
		     document.getElementById("pc").innerHTML = formatPc(pstatus.pc)

		     document.getElementById("fx").innerHTML = ["c:", pstatus.fc, "z:", pstatus.fz, "i:", pstatus.fi, "d:", pstatus.fd, "b:", _fb, "_:", 1, "v:", pstatus.fv, "n:", pstatus.fn].join(" ");

		     document.getElementById("intim").innerHTML = pstatus.intim.toString(10);
		     document.getElementById("instat").innerHTML = pstatus.instat.toString(2);
		     document.getElementById("interval").innerHTML = pstatus.interval.toString(10);
		     document.getElementById("timerCounter").innerHTML = pstatus.timerCounter.toString(10);
		     document.getElementById("xpos").innerHTML = pstatus.x.toString(10);
		     document.getElementById("ypos").innerHTML = pstatus.y.toString(10);
		     document.getElementById("p0").innerHTML = pstatus.p0.toString(2).padStart(8, "0");
		     document.getElementById("p1").innerHTML = pstatus.p1.toString(2).padStart(8, "0");
		     document.getElementById("p0x").innerHTML = pstatus.p0x.toString(10);
		     document.getElementById("p1x").innerHTML = pstatus.p1x.toString(10);

		     document.getElementById("pf0").innerHTML = pstatus.pf0.toString(2).padStart(8, "0");
		     document.getElementById("pf1").innerHTML = pstatus.pf1.toString(2).padStart(8, "0");
		     document.getElementById("pf2").innerHTML = pstatus.pf2.toString(2).padStart(8, "0");
		     document.getElementById("pf").innerHTML = pstatus.pf.toString(2).padStart(20, "0");
	             document.getElementById("ctrlpf").innerHTML = `$${pstatus.ctrlpf.toString(16).padStart(2, "0")} (${pstatus.ctrlpf.toString(2).padStart(8, "0")})`;
		   }

		   const loadMemory = () => {
		     const memoryEl = document.getElementById("memory");

		     const columns = []
		     for (let i = 0; i < 0x10; i++) {
			columns.push(i.toString(16).padStart(2, "0"));
		     }
		     
	             memoryEl.innerHTML = "<div>&nbsp;&nbsp;&nbsp;" + columns.join(" ") + "</div>";
		     for (let y = 0x00; y < 0x100; y+=0x10) {
		       const row = [];
		       for (let x = 0; x < 0x10; x++) {
			 const address = y + x;

			 const value = pstatus.memory[address];

			 row.push(value.toString(16).padStart(2, "0"));
		       }

		       memoryEl.innerHTML += `<div>${y.toString(16).padStart(2, "0")} ${row.join(" ")}</div>`;
		     }
		   }

		   const updateHighlights = () => {
		     const lines = document.querySelectorAll("#source div[id^='line-']");
		     for (const line of lines) {
		       const address = parseInt(line.id.slice(5), 16);

		       if (address === pstatus.pc) {
			 line.style.background = "#00ff00";
                         document.getElementById(`${line.id}`).scrollIntoView({ /*behavior: "smooth",*/ block: "nearest" });
		       } else {
			 line.style.background = "none";
		       }
		     }
		   }

		   const loadSource = (rbx) => {
                     const lines = decode(rbx);

		     const asm = [];
		     for (const line of lines) {
			const [address, src, ax] = line;
			const srcHtml = src.replaceAll(" ", "&nbsp;");

			if (!ax) {
			  if (breakpoints.has(parseInt(address, 16))) {
		            asm.push(`<div id="line-${address}"><span style="background: #ff0000; color: #fff;">${address}</span> ${srcHtml}</div>`);
			  } else {
		            asm.push(`<div id="line-${address}">${address} ${srcHtml}</div>`);
			  }
		        } else {
                          asm.push(`<div class="blank">&nbsp;</div>`);
                          asm.push(`<div id="line-${src}-data">.data ${src}</div>`);

			  const cs = 8;
			  const cx = [];
			  for (let i = 0; i < ax.length; i += cs) {
                            const c = ax.slice(i, i + cs);
                            cx.push(c);
                          }

			  const offset = parseInt(src.substr(0, 4), 16) + 1;
			  for (let i = 0; i < cx.length; i++) {
			    const c = cx[i];
			    const a = (offset + (i * cs)).toString(16).padStart(4, "0");
				  asm.push(`<div id="line-${a}">${a} ${c.join(" ")}</div>`);
			  }

		          asm.push(`<div class="blank">&nbsp;</div>`);
			}

		     }

                     document.getElementById("source").innerHTML = asm.join("\n");
		   }

		   const readRom = () => {
		     const rom = roms[romName];

                     return loadFromBase64(rom);
		   }

		   const clearState = () => {
		     rx = 0;
		     ry = 0;
		     ra = 0;
		     sp = 0xff;

		     fc = 0;
                     fc = 0;
                     fn = 0;
                     fi = 0;
                     fd = 0;
                     _fb = 0;
                     fv = 0;
                     fz = 0;

		     pc = 0;
		   }

		   let controller = undefined;
		   let switches = undefined;;
		   const startRom = () => {
		     console.log("startRom", romName);
		     const romBytes = readRom();

                     loadSource(romBytes);

		     clearState();

		     // logSteps = 4_500;
		     const [process, ctrl, swch] = machine(romBytes);

		     process();
		
		     controller = ctrl;
		     switches = swch;
		   }
                   
		   const toggleBreakpoint = (address) => {
		     const romBytes = readRom();

		     if (breakpoints.has(address)) {
		       breakpoints.delete(address);
		     } else {
		       breakpoints.add(address);
		     }

		     loadSource(romBytes);
		   }

		   document.addEventListener("DOMContentLoaded", (event) => {
		     // clearState();
		     // const rt = async () => {
		     //   await testAdc();
		     //   await testSbc();
		     // }

		     // rt();
		     document.getElementById("source").addEventListener("dblclick", (event) => {
	               toggleBreakpoint(parseInt(event.target.innerHTML.slice(0, 4), 16));
		     });

		     document.getElementById("continue").addEventListener("click", (event) => {
                       document.dispatchEvent(new Event("continue"));
		     });
		     document.getElementById("step").addEventListener("click", (event) => {
                       document.dispatchEvent(new Event("step"));
		     });
		     document.getElementById("restart").addEventListener("click", (event) => {
                       startRom();
		     });

		     document.getElementById("xConditionLower").addEventListener("change", (event) => {
		        const value = parseInt(event.target.value, 10) || undefined;

		        bpConditional.x.lower = value;
		     });
		     document.getElementById("xConditionUpper").addEventListener("change", (event) => {
		        const value = parseInt(event.target.value, 10) || undefined;

		        bpConditional.x.upper = value;
		     });
		     document.getElementById("yConditionLower").addEventListener("change", (event) => {
		        const value = parseInt(event.target.value, 10) || undefined;

		        bpConditional.y.lower = value;
		     });
		     document.getElementById("yConditionUpper").addEventListener("change", (event) => {
		        const value = parseInt(event.target.value, 10) || undefined;

		        bpConditional.y.upper = value;
		     });


                     startRom();

		     document.addEventListener("draw", () => { frc++; });
		     document.addEventListener("chrom", () => { startRom(); breakpoints.clear(); });
		     document.addEventListener("break", () => { loadDebugInfo(); loadMemory(); updateHighlights(); });

		     document.addEventListener("keydown", (event) => {
		       if (event.key === "w") { controller.mn(); return false; }
		       if (event.key === "d") { controller.me(); return false; }
		       if (event.key === "s") { controller.ms(); return false; }
		       if (event.key === "a") { controller.mw(); return false; }

		       if (event.code === "Space") { controller.fire(); return false; }

		       if (event.key === "r") { switches.reset(); return false; }
		       if (event.key === "q") { switches.select(); return false; }

		       return false;
		     });

       		     document.addEventListener("keyup", (event) => {
		       if (event.key === "w") { controller.mnc(); return false; }
		       if (event.key === "d") { controller.mec(); return false; }
		       if (event.key === "s") { controller.msc(); return false; }
		       if (event.key === "a") { controller.mwc(); return false; }

		       if (event.code === "Space") { controller.firec(); return false; }

		       if (event.key === "r") { switches.resetc(); return false; }
		       if (event.key === "q") { switches.selectc(); return false; }

		       return false;
		     });
                    });

		   var frc = 0; 
		   
		   const updateFr = () => {
		     document.getElementById("fr").value = frc;

		     frc = 0;
		   }

		   setInterval(() => updateFr(), 1_000);
		</script>
	</head>
	<body>
          <div style="display: flex; gap: 10px">
	    <div>
	      <canvas id="tehScreen" width="160" height="192"></canvas>
	      <div><input type="text" id="fr"></div>
	      <div style="display: flex">
	        <select onChange="changeRom(this.options[this.selectedIndex].value)" autofocus>
	          <option value="kernel01">Kernel 01</option>
	          <option value="kernel13">Kernel 13</option>
	          <option value="kernel15">Kernel 15</option>
	          <option value="kernel22">Kernel 22</option>
	          <option value="demo3_8">Demo3_8</option>
		  <option value="bitmap" selected>bitmap</option>
		  <option value="complexscene1">complexscene1</option>
	          <option value="sethorizpos">sethorizpos</option>
	          <option value="piatimer">piatimer</option>
	          <option value="timing2">timing2</option>
 	          <option value="hello">Hello</option>
	          <option value="diag">Diag</option>
	          <option value="logo">Logo</option>
	          <option value="combat">Combat</option>
	          <option value="frogger">Frogger</option>
	          <option value="pongsports">Pong Sports</option>
	        </select>
	      </div>
	    </div>
	    <div id="source" style="font-family: courier; overflow-y: scroll; max-height: 50vh; scrollbar-width: none;"></div>
	    <div style="position: fixed; left: 30%;">
	      <div style="display: flex; flex-direction: column; font-family: courier;">
		<div id="debuginfo">
		  <div style="font-weight: bold;">CPU</div>
		  <div>RX: <span id="rx">0</span></div>
		  <div>RY: <span id="ry">0</span></div>
		  <div>RA: <span id="ra">0</span></div>
		  <div>SP: <span id="sp">0</span></div>
		  <div>PC: <span id="pc">0</span></div>
		  <div>Flags: <span id="fx">0</span></div>
		  <div style="font-weight: bold;">Timer</div>
		  <div>Intim: <span id="intim">0</span></div>
		  <div>Instat: <span id="instat">0</span></div>
		  <div>Interval: <span id="interval">0</span></div>
		  <div>TimerCounter: <span id="timerCounter">0</span></div>
		  <div style="font-weight: bold;">TIA</div>
		  <div>Xpos: <span id="xpos">0</span></div>
		  <div>Ypos: <span id="ypos">0</span></div>
		  <div>P0X: <span id="p0x">-1</span></div>
		  <div>P1X: <span id="p1x">-1</span></div>
		  <div>P0: <span id="p0">0</span></div>
		  <div>P1: <span id="p1">0</span></div>
		  <div>PF0: <span id="pf0">0</span></div>
		  <div>PF1: <span id="pf1">0</span></div>
		  <div>PF2: <span id="pf2">0</span></div>
		  <div>PF: <span id="pf">0</span></div>
		  <div>CTRLPF: <span id="ctrlpf">0</span></div>
		</div>
		<div>
		  <div style="font-weight: bold;">Conditionals</div>
		  <div>X: <input type="text" id="xConditionLower" value=""> - <input type="text" id="xConditionUpper" value=""></div>
		  <div>Y: <input type="text" id="yConditionLower" value=""> - <input type="text" id="yConditionUpper" value=""></div>
		</div>
		<div id="memory" style="font-family: courier;"></div>
		<div style="display: flex; gap: 10px;">
		  <button id="continue">Continue</button>
		  <button id="step">Step</button>
		  <button id="restart">Restart</button>
		</div>
	      </div>
	    </div>
          </div>
	</body>
</html>
